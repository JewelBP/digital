<!DOCTYPE html>
<html lang="bn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#00002a">
    <title>RMP MT Contacts - Splash</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Macondo+Swash+Caps&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Hind Siliguri', sans-serif;
            background-color: #00002a;
            overflow: hidden !important;
        }

        /* ---------- Splash ---------- */
        #splash-screen {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background-color: #00002a;
            z-index: 1000000;
            opacity: 1;
            visibility: visible;
            transition: opacity 0.6s ease-out, visibility 0.6s;
            overflow: hidden;
        }

        #splash-screen.fade-out {
            opacity: 0;
            visibility: hidden;
        }

        /* ওপরের সাদা অংশ: নিচের ডান কোণ গোল */
        .splash-top {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 46%;
            background: #ffffff;
            border-bottom-right-radius: 11vw;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }

        /* নিচের নেভি অংশ: ওপরের বাম কোণ গোল (পেছনে সাদা দেখা যাবে) */
        .splash-bottom {
            position: absolute;
            top: 46%;
            left: 0;
            right: 0;
            bottom: 0;
            background: #00002a;
            border-top-left-radius: 11vw;
            z-index: 3;
        }

        .splash-bottom-fill {
            position: absolute;
            top: 46%;
            left: 0;
            width: 11vw;
            height: 11vw;
            background: #ffffff;
            z-index: 1;
        }

        .splash-logo-wrap {
            perspective: 900px;
        }

        .splash-logo {
            width: 30vw;
            max-width: 150px;
            min-width: 100px;
            height: auto;
            display: block;
            /* ভিডিওর মতো Y-অক্ষে একবার পূর্ণ ঘুরে ধীরে থামবে */
            animation: spinLogo 1.5s cubic-bezier(0.15, 0.55, 0.3, 1) both;
        }

        .splash-content {
            position: absolute;
            top: 46%;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 4;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 0 20px 6vh;
            color: #ffffff;
            font-family: 'Quicksand', 'Hind Siliguri', sans-serif;
        }

        .splash-title {
            font-family: 'Macondo Swash Caps', 'Quicksand', cursive;
            font-size: 26px;
            font-weight: 400;
            letter-spacing: 1px;
            margin: 0 0 14px;
            animation: fadeUp 0.7s ease-out 0.5s both;
        }

        .splash-subtitle {
            font-size: 21px;
            font-weight: 500;
            margin: 0 0 40px;
            animation: fadeUp 0.7s ease-out 0.7s both;
        }

        .splash-dev {
            font-size: 15px;
            font-weight: 500;
            margin: 0 0 36px;
            opacity: 0.95;
            animation: fadeUp 0.7s ease-out 0.9s both;
        }

        .welcome-btn {
            border: 0;
            background: #e8407a;
            color: #ffffff;
            font-family: 'Quicksand', 'Hind Siliguri', sans-serif;
            font-size: 16px;
            font-weight: 600;
            text-transform: uppercase;
            padding: 15px 22px;
            min-width: 140px;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(232, 64, 122, 0.35);
            animation: fadeUp 0.7s ease-out 1.1s both;
            transition: transform 0.15s;
        }

        .welcome-btn:active {
            transform: scale(0.96);
        }

        @keyframes spinLogo {
            from { transform: rotateY(0deg); }
            to   { transform: rotateY(360deg); }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ---------- Password Gate ---------- */
        #passwordGate {
            position: fixed;
            inset: 0;
            z-index: 999999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.58);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        #passwordGate.show {
            display: flex;
        }

        .password-gate-box {
            width: 100%;
            max-width: 380px;
            background: var(--card-bg, #ffffff);
            color: var(--text-main, #212529);
            border-radius: 20px;
            padding: 28px 22px 24px;
            box-shadow: 0 20px 70px rgba(0, 0, 0, 0.35);
            text-align: center;
            animation: passwordBoxIn 0.35s ease-out;
        }

        @keyframes passwordBoxIn {
            from { opacity: 0; transform: translateY(15px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .password-shield {
            width: 70px;
            height: 70px;
            margin: 0 auto 16px;
            border-radius: 50%;
            background: rgba(13, 110, 253, 0.10);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
        }

        .password-gate-box h2 {
            margin: 0 0 7px;
            font-size: 22px;
            font-weight: 700;
        }

        .password-gate-box p {
            margin: 0 0 20px;
            color: var(--text-muted, #6c757d);
            font-size: 14px;
            line-height: 1.55;
        }

        .password-field {
            width: 100%;
            height: 50px;
            padding: 0 15px;
            border: 1px solid var(--border-color, #ced4da);
            border-radius: 11px;
            background: var(--input-bg, #ffffff);
            color: var(--text-main, #212529);
            outline: none;
            font-family: inherit;
            font-size: 16px;
            text-align: center;
            box-sizing: border-box;
        }

        .password-field:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.13);
        }

        .password-error {
            min-height: 22px;
            margin-top: 9px;
            font-size: 13px;
            color: #dc3545;
        }

        .password-submit {
            width: 100%;
            height: 50px;
            margin-top: 4px;
            border: 0;
            border-radius: 11px;
            background: #0d6efd;
            color: #fff;
            font-family: inherit;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s, opacity 0.15s;
        }

        .password-submit:active {
            transform: scale(0.98);
        }

        .password-submit:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .password-hint {
            margin-top: 14px !important;
            margin-bottom: 0 !important;
            font-size: 12px !important;
            color: var(--text-muted, #6c757d);
        }
    </style>
</head>

<body>

<div id="splash-screen">
    <div class="splash-top">
        <div class="splash-logo-wrap">
            <img class="splash-logo" src="icons/icon-192.png" alt="RMP Logo">
        </div>
    </div>
    <div class="splash-bottom-fill"></div>
    <div class="splash-bottom"></div>

    <div class="splash-content">
        <h1 class="splash-title">RMP MT CONTACTS</h1>
        <p class="splash-subtitle">Rajshahi Metropolitan Police</p>
        <p class="splash-dev">Developed by Jewel Rana</p>
        <button id="welcomeBtn" class="welcome-btn" type="button">Welcome</button>
    </div>
</div>

<div id="passwordGate">
    <div class="password-gate-box">
        <div class="password-shield">🔐</div>
        <h2 id="passwordGateTitle">নিরাপত্তা যাচাই</h2>
        <p id="passwordGateMessage">অ্যাপে প্রবেশ করতে আপনার পাসওয়ার্ড দিন।</p>
        <input id="appPassword" class="password-field" type="password" autocomplete="current-password" placeholder="পাসওয়ার্ড">
        <div id="passwordError" class="password-error"></div>
        <button id="passwordSubmit" class="password-submit" type="button">প্রবেশ করুন</button>
        <p id="passwordHint" class="password-hint">নিরাপত্তার জন্য পাসওয়ার্ড দিন।</p>
    </div>
</div>

<script type="module">
    import { db } from './js/firebase.js';
    import { ref, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    (function () {
        "use strict";
        const UNLOCK_FLAG = "police_phonebook_is_unlocked";
        const splash = document.getElementById("splash-screen");
        const welcomeBtn = document.getElementById("welcomeBtn");
        const passwordGate = document.getElementById("passwordGate");
        const passwordInput = document.getElementById("appPassword");
        const passwordButton = document.getElementById("passwordSubmit");
        const passwordError = document.getElementById("passwordError");
        const passwordTitle = document.getElementById("passwordGateTitle");
        const passwordMessage = document.getElementById("passwordGateMessage");
        const passwordHint = document.getElementById("passwordHint");

        function unlockApp() {
            localStorage.setItem(UNLOCK_FLAG, "true");
            // পাসওয়ার্ড সঠিক হওয়ার পর সরাসরি ইনডেক্স পেজে চলে যাবে
            window.location.href = "index.html";
        }

        function showLoginMode() {
            passwordTitle.textContent = "নিরাপত্তা যাচাই";
            passwordMessage.textContent = "RMP MT Contacts ব্যবহার করতে অ্যাডমিন নির্ধারিত পাসওয়ার্ড দিন।";
            passwordInput.placeholder = "পাসওয়ার্ড";
            passwordButton.textContent = "প্রবেশ করুন";
            passwordHint.textContent = "সঠিক পাসওয়ার্ড দিলে তবেই অ্যাপে প্রবেশ করা যাবে।";
        }

        function showPasswordGate() {
            const isUnlocked = localStorage.getItem(UNLOCK_FLAG);
            if (isUnlocked === "true") {
                unlockApp();
                return;
            }
            showLoginMode();
            passwordGate.classList.add("show");
            setTimeout(function () {
                passwordInput.focus();
            }, 100);
        }

        async function processPassword() {
            const password = passwordInput.value;
            passwordError.textContent = "";

            if (!password) {
                passwordError.textContent = "দয়া করে পাসওয়ার্ড দিন।";
                passwordInput.focus();
                return;
            }

            passwordButton.disabled = true;
            passwordButton.textContent = "যাচাই হচ্ছে...";

            try {
                const passwordRef = ref(db, 'webapp/admin/password');
                const snapshot = await get(passwordRef);

                if (snapshot.exists()) {
                    const correctPassword = snapshot.val();
                    if (password === correctPassword) {
                        unlockApp();
                    } else {
                        passwordError.textContent = "ভুল পাসওয়ার্ড! সঠিক পাসওয়ার্ড দিন।";
                        passwordInput.value = "";
                        passwordInput.focus();
                        passwordButton.disabled = false;
                        passwordButton.textContent = "প্রবেশ করুন";
                    }
                } else {
                    passwordError.textContent = "ডেটাবেজে কোনো পাসওয়ার্ড সেট করা নেই।";
                    passwordButton.disabled = false;
                    passwordButton.textContent = "প্রবেশ করুন";
                }
            } catch (error) {
                console.error("Password verification error:", error);
                passwordError.textContent = "পাসওয়ার্ড যাচাই করা যায়নি। ইন্টারনেট সংযোগ চেক করুন।";
                passwordButton.disabled = false;
                passwordButton.textContent = "প্রবেশ করুন";
            }
        }

        passwordButton.addEventListener("click", processPassword);

        passwordInput.addEventListener("keydown", function (event) {
            if (event.key === "Enter") {
                event.preventDefault();
                processPassword();
            }
        });

        // স্প্ল্যাশ শেষ করে পরের ধাপে যাওয়া (একবারই চলবে)
        let leaving = false;
        function leaveSplash() {
            if (leaving) return;
            leaving = true;
            splash.classList.add("fade-out");
            setTimeout(function () {
                splash.style.display = "none";
                showPasswordGate();
            }, 600);
        }

        welcomeBtn.addEventListener("click", leaveSplash);

        // অ্যানিমেশন শেষ হলে নিজে থেকেই এগিয়ে যাবে
        window.addEventListener("load", function () {
            setTimeout(leaveSplash, 2800);
        });
    })();
</script>

</body>
</html>
