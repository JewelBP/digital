        body {

            padding-bottom: 0 !important;
            margin: 0 !important;
            padding: 0 !important;
            overflow: hidden;
            height: 100vh;
            height: 100dvh;
        }
        html {
            margin: 0 !important;
            padding: 0 !important;
            height: 100%;
        }
        #appContainer {

            flex-direction: column;
            height: 100vh;
            height: 100dvh;

        }

            color: #ffffff;

        }

            border: 1px solid rgba(255, 255, 255, 0.18);

            height: 34px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;

        }

            color: #ffffff;

        }

            color: #ffffff;
            font-size: 11px;
            width: 16px;
            height: 16px;
            border-radius: 50%;

            align-items: center;
            justify-content: center;
        }

            height: 65px;

            object-fit: cover;
            margin-left: 4px;

        /* ডেট এবং টাইমের ঠিক নিচে হেডারের ভেতরে সার্চ ফিল্ড */

            display: none;
            padding: 2px 16px 6px;
            width: 70%;

            margin: 0 auto;

        .header-search-inline.is-visible {
            display: block !important;
        }
        .subpage-search-field {

            background: rgba(255,255,255,0.11);

        .subpage-search-icon {
            flex: 0 0 auto;
            color: #cbd5e1;
            font-size: 23px;

        .header-search-inline input[type="search"] {

            height: 100% !important;
            padding: 0 !important;
            border: 0 !important;

            margin: 4px 16px 0;

            height: 145px;

            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .slider-track {
            display: flex;
            height: 100%;
            transition: transform 0.5s ease-in-out;
        }
        .slide-item {
            min-width: 100%;
            height: 100%;
            position: relative;
        }
        .slide-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .slide-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.85) 10%, rgba(0, 0, 0, 0.1) 80%);

            align-items: flex-end;
            justify-content: space-between;

        .slide-info {

            align-items: center;

        }

            height: 28px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }
        .slide-info h4 {
            color: #ffffff;
            font-size: 13px;
            font-weight: 600;
            margin: 0;
        }
        .slide-btn {
            background: #0ea5e9;
            color: #ffffff !important;
            border: none;
            padding: 5px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
        }
        .slider-dots {
            position: absolute;
            bottom: 6px;
            left: 50%;
            transform: translateX(-50%);

            gap: 5px;
        }
        .slider-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
        }
        .slider-dot.active {
            background: #ffffff;
            width: 14px;
            border-radius: 4px;
        }

        /* কন্টাক্ট ডিটেইলস পেজ (#dataDetailsView) */
        body.is-data-details-mode {

<script>
    (async function loadIndex1Part() {
        const slot = document.getElementById("secondaryViewsSlot");
        if (!slot) return;
        try {
            const res = await fetch("index1.html");
            if (res.ok) {
                const htmlText = await res.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlText, "text/html");
                const partContent = doc.getElementById("index1Content") || doc.body;
                slot.innerHTML = partContent.innerHTML;
            }
        } catch (err) {
            console.error("Failed to load index1.html:", err);
        }
    })();
</script>

<script type="module">
    import { initNotificationSystem } from './js/notification.js';
    document.addEventListener("DOMContentLoaded", () => {
        initNotificationSystem();
    });

    import { initWebPushNotifications } from './js/fcm-setup.js';
    // Already allowed before: register token silently on load.
    // Otherwise ask on the first tap (browsers/iOS require a user gesture).
    document.addEventListener("DOMContentLoaded", () => {
        if (!("Notification" in window)) return;
        if (Notification.permission === "granted") {
            initWebPushNotifications();
        } else if (Notification.permission === "default") {
            const ask = () => {
                document.removeEventListener("click", ask);
                initWebPushNotifications();
            };
            document.addEventListener("click", ask, { once: true });
        }
    });
</script>

<script>
    function updateLiveClock() {
        const clockEl = document.getElementById('liveDateTime');
        if (!clockEl) return;
        const now = new Date();
        const dateStr = now.toLocaleDateString('en-GB');
        const timeStr = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        clockEl.textContent = `${dateStr} ${timeStr}`;
    }
    setInterval(updateLiveClock, 1000);
    updateLiveClock();

    (function initSubPageHeaderSearch() {
        const mainDashboard = document.getElementById('mainDashboardView');
        const categoryDetails = document.getElementById('categoryDetailsView');
        const dataDetails = document.getElementById('dataDetailsView');
        const allSearchContainer = document.getElementById('allSearchContainer');
        const heroSlider = document.getElementById('heroSlider');
        const subPageSearchWrapper = document.getElementById('subPageHeaderSearchWrapper');
        const homeSearchBox = document.getElementById('searchBox');
        const subInput = document.getElementById('subPageSearchInput');
        const mainInput = document.getElementById('searchInput');
        const clearButton = document.getElementById('clearSubPageSearch');
        const searchField = subPageSearchWrapper?.querySelector('.subpage-search-field');
        const mainScrollSheet = document.getElementById('mainScrollSheet');
        const appTitleText = document.querySelector('.app-title-text');

        if (!heroSlider || !subPageSearchWrapper) return;

        function isFavoriteViewActive() {
            const titleText = appTitleText ? appTitleText.textContent.trim().toLowerCase() : '';
            return titleText.includes('favorite') || !!document.querySelector('#favoriteNumbersView:not(.hidden), #favoritesView:not(.hidden)');
        }

        function filterFavoriteCards(query) {
            if (!isFavoriteViewActive()) return;
            const q = (query || '').trim().toLowerCase();
            const cards = document.querySelectorAll('#categoryList .data-card-item, #favoriteNumbersView .data-card-item, #favoritesView .data-card-item');
            cards.forEach(card => {
                const text = (card.textContent || '').toLowerCase();
                card.style.display = (!q || text.includes(q)) ? '' : 'none';
            });
        }

        let lastViewKey = null;

        function syncSearchVisibility() {
            const isHomeHidden = mainDashboard && mainDashboard.classList.contains('hidden');
            const isSubPage = categoryDetails && !categoryDetails.classList.contains('hidden');
            const isDataPage = dataDetails && !dataDetails.classList.contains('hidden');
            const titleText = appTitleText ? appTitleText.textContent.trim().toLowerCase() : '';
            const isFavoritePage = isFavoriteViewActive();
            const isAllSearchPage = (allSearchContainer && !allSearchContainer.classList.contains('hidden')) || titleText.includes('search all');

            document.body.classList.toggle('is-data-details-mode', isDataPage);

            const hideSlider = isHomeHidden || isSubPage || isDataPage || isFavoritePage || isAllSearchPage;
            heroSlider.style.display = hideSlider ? 'none' : '';
            if (homeSearchBox) homeSearchBox.style.display = hideSlider ? 'none' : '';

            const showSubSearch = (isSubPage || isAllSearchPage || isFavoritePage) && !isDataPage;
            subPageSearchWrapper.classList.toggle('is-visible', showSubSearch);
            subPageSearchWrapper.classList.toggle('hidden', !showSubSearch);

            // শুধু পেজ/ভিউ বদলালে স্ক্রল উপরে যাবে (বাটনে চাপ/স্লাইডার অ্যানিমেশনে নয়)
            const viewKey = [isHomeHidden, isSubPage, isDataPage, isFavoritePage, isAllSearchPage, titleText].join('|');
            const viewChanged = viewKey !== lastViewKey;
            lastViewKey = viewKey;

            if (viewChanged && mainScrollSheet && !document.activeElement?.matches('#subPageSearchInput, #searchInput')) {
                mainScrollSheet.scrollTop = 0;
            }

            if (!isSubPage && !isAllSearchPage && !isFavoritePage && subInput) {
                subInput.value = '';
                searchField?.classList.remove('has-value');
                if (mainInput && mainInput.value) {
                    mainInput.value = '';
                    mainInput.dispatchEvent(new Event('input', { bubbles: true }));
                }
            } else if (isFavoritePage && subInput && subInput.value) {
                filterFavoriteCards(subInput.value);
            }
        }

        if (subInput && mainInput) {
            subInput.addEventListener('input', () => {
                searchField?.classList.toggle('has-value', subInput.value.length > 0);
                if (isFavoriteViewActive()) {
                    filterFavoriteCards(subInput.value);
                } else {
                    mainInput.value = subInput.value;
                    mainInput.dispatchEvent(new Event('input', { bubbles: true }));
                }
            });

            subInput.addEventListener('keydown', event => {
                if (event.key === 'Escape') {
                    subInput.value = '';
                    searchField?.classList.remove('has-value');
                    if (isFavoriteViewActive()) {
                        filterFavoriteCards('');
                    } else {
                        mainInput.value = '';
                        mainInput.dispatchEvent(new Event('input', { bubbles: true }));
                    }
                    subInput.blur();
                }
            });
        }

        clearButton?.addEventListener('click', () => {
            if (!subInput || !mainInput) return;
            subInput.value = '';
            searchField?.classList.remove('has-value');
            if (isFavoriteViewActive()) {
                filterFavoriteCards('');
            } else {
                mainInput.value = '';
                mainInput.dispatchEvent(new Event('input', { bubbles: true }));
            }
            subInput.focus();
        });

        const observer = new MutationObserver(syncSearchVisibility);
        const mainContainer = document.querySelector('main.container');
        if (mainContainer) {
            observer.observe(mainContainer, {
                attributes: true,
                childList: true,
                subtree: true,
                attributeFilter: ['class', 'style']
            });
        }
        if (appTitleText) {
            observer.observe(appTitleText, {
                childList: true,
                characterData: true,
                subtree: true
            });
        }
        syncSearchVisibility();
    })();
</script>

<script>
    (function syncMainColor() {
        const DEFAULT = '#020624';
        function apply() {
            let color = DEFAULT;
            const path = document.querySelector('.bottom-nav-svg path');
            if (path) {
                const fill = getComputedStyle(path).fill;
                if (fill && fill !== 'none' && !/rgba\(.*,\s*0\)$/.test(fill) && fill !== 'transparent') color = fill;
            }
            document.documentElement.style.setProperty('--app-main-color', color);
            const normalized = color.replace(/\s+/g, '').toLowerCase();
            const isDefault = normalized === '#020624' || normalized === 'rgb(2,6,36)';
            document.body?.classList.toggle('has-custom-theme', !isDefault);
        }
        document.addEventListener('DOMContentLoaded', apply);
        window.addEventListener('load', apply);
        new MutationObserver(apply).observe(document.documentElement, { attributes: true, attributeFilter: ['style', 'class'] });
        document.addEventListener('DOMContentLoaded', () => {
            new MutationObserver(apply).observe(document.body, { attributes: true, attributeFilter: ['style', 'class'] });
        });
        setInterval(apply, 1500);
    })();
</script>
